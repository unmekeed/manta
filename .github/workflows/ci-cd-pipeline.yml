# CI-конвейер монорепозитория (Гл. 10.4 спецификации).
# Фаза 1: lint + unit-тесты Go-сервисов, валидация схем.
# Последующие фазы добавят contract-tests, сборку образов, подпись и SBOM.
name: ci-cd-pipeline

on:
  push:
  pull_request:


jobs:
  go-lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, replay-parser/svc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: apps/${{ matrix.service }}/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: apps/${{ matrix.service }}
      - name: Test
        run: go test -race -cover ./...
        working-directory: apps/${{ matrix.service }}
      - name: Build
        run: go build ./...
        working-directory: apps/${{ matrix.service }}

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data-collector, feature-extractor, feature-store,
                  ml-service, report-generator, similarity, draft, coach]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install pytest -r apps/${{ matrix.service }}/requirements.txt
          PYTHONPATH=apps/${{ matrix.service }}/src:libs \
            pytest apps/${{ matrix.service }}/tests -q

  scripts-test:
    # Панель управления дашборда: она умеет запускать процессы, поэтому её
    # защита (CSRF-заголовок, loopback-биндинг, белый список) проверяется в
    # CI наравне с кодом сервисов.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          # steam и dota2 нужны тестам входа по токену и отчёта о
          # ранговых полях GC. Без них тесты помечаются пропущенными —
          # то есть суть гибридного входа и проверка имён полей
          # протокола не выполнялись бы в CI вовсе, а файлы выглядели бы
          # зелёными. Джоба изолированная, конфликтовать их protobuf не
          # с чем.
          #
          # pyyaml — по ровно той же причине, и её стоит проговорить.
          # Тесты compose (наложение для VPS и упаковка libs в образы)
          # начинаются с importorskip("yaml"): без пакета они не падают, а
          # ПРОПУСКАЮТСЯ. То есть проверка «ни один порт не смотрит
          # наружу» в CI не выполнялась вовсе, а джоба была зелёной.
          pip install pytest pyyaml steam==1.4.4 dota2==1.1.0
          pytest scripts/tests -q

  libs-test:
    # Общие библиотеки (libs/manta_grpc — mTLS-обвязка внутренних gRPC).
    # Отдельной джобой, а не в матрице сервисов: у них свои requirements,
    # а тесты handshake поднимают настоящий сервер и metrics endpoint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install pytest grpcio prometheus-client
          pytest libs/tests -q

  frontend-test:
    # Фронт до спринта 139 не проверялся вовсе. Появился повод: подложка
    # карты держит СВОЮ копию границ карты (фронт не может импортировать
    # libs/dota_map.py), а копия расходится с оригиналом не падением, а
    # кривым наложением — метки лягут мимо, и никто не узнает.
    #
    # Сборку тоже гоняем: tsc -b ловит рассогласование пропсов, которое
    # тесты компонентов сами по себе не увидят.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  cpp-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install snappy
        run: sudo apt-get update && sudo apt-get install -y libsnappy-dev
      - name: Configure
        run: cmake -B build -S apps/replay-parser -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  schemas-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas parse
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          files = glob.glob("libs/schemas/*.json")
          assert files, "no schemas found"
          for f in files:
              json.load(open(f))
              print("OK", f)
          EOF
      - name: Validate compose file
        run: docker compose -f deployments/docker-compose.yml config -q

  security:
    # D6: SAST/SCA-гейт. Секреты и уязвимости ловятся до мержа, а не
    # ревью раз в фазу. Отчёт и принятые риски — docs/security-review.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # security-scan.sh обходит историю коммитов
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: false
      - name: Install scanners
        run: |
          pip install pip-audit
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Scan
        run: ./scripts/security-scan.sh
