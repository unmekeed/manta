# Локальная инфраструктура разработки Manta (Гл. 12.6 спецификации).
# Облегчённые одноузловые версии всех хранилищ и брокера.
name: manta

x-collector-env:
  # Настройки СБОРА, приходящие из окружения машины (спринт 143).
  #
  # Имена И УМОЛЧАНИЯ выведены из исходника коллектора, а не подобраны на
  # глаз. Умолчание тут не украшение: `${VAR:-}` задаёт переменную ПУСТОЙ
  # строкой, а это не то же самое, что «не задана». int("") падает с
  # ValueError, то есть коллектор не стартовал бы вовсе.
  #
  # METRICS_PORT сюда НЕ входит намеренно: он у каждого сервиса свой, и
  # общее значение занял бы первый стартовавший (инцидент 2026-07-27).
  collector-env: &collector-env
      BUDGET_RETRY_S: "${BUDGET_RETRY_S:-3600}"
      CANDIDATES_LIMIT: "${CANDIDATES_LIMIT:-20}"
      COLLECTOR_SHARD_COUNT: "${COLLECTOR_SHARD_COUNT:-1}"
      COLLECTOR_SHARD_ID: "${COLLECTOR_SHARD_ID:-0}"
      LEAGUE_BATCH: "${LEAGUE_BATCH:-8}"
      LEAGUE_MAX_AGE_DAYS: "${LEAGUE_MAX_AGE_DAYS:-30}"
      LEAGUE_TIERS: "${LEAGUE_TIERS:-premium,professional}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OPENDOTA_API_KEY: "${OPENDOTA_API_KEY:-}"
      OPENDOTA_BURST_SLEEP_S: "${OPENDOTA_BURST_SLEEP_S:-90}"
      OPENDOTA_DELAY_S: "${OPENDOTA_DELAY_S:-1.1}"
      OPENDOTA_GLOBAL_LIMIT: "${OPENDOTA_GLOBAL_LIMIT:-1900}"
      OPENDOTA_LIMIT: "${OPENDOTA_LIMIT:-3}"
      OPENDOTA_MIN_PATCH: "${OPENDOTA_MIN_PATCH:-}"
      # Платный тариф (спринт 183): месячный потолок вызовов и цена
      # вызова. 0 — потолка нет, верное умолчание для бесплатного
      # тарифа; на ключе коллектор предупредит, что дыра открыта.
      OPENDOTA_MONTHLY_LIMIT: "${OPENDOTA_MONTHLY_LIMIT:-0}"
      OPENDOTA_COST_PER_CALL: "${OPENDOTA_COST_PER_CALL:-0.0001}"
      OPENDOTA_MIN_RANK: "${OPENDOTA_MIN_RANK:-80}"
      # Возврат к припаркованным реплеям (спринт 153): сколько брать за
      # прогон. Источник `parked` запускается вручную, но переменную
      # читает точка входа, а она общая для всех коллекторов.
      PARKED_LIMIT: "${PARKED_LIMIT:-5}"
      # Скачивание по солям, добытым у GC (спринты 179, 181): сколько
      # реплеев брать за прогон. Восемь в час согласовано с добычей —
      # `scripts/gc-salts.sh` берёт столько же солей, — так что очередь
      # не растёт и не простаивает.
      SALTS_LIMIT: "${SALTS_LIMIT:-8}"
      # На сколько патчей назад принимаем матчи. Runbook 4a велит
      # поднимать её после выхода патча — до спринта 154 это указание
      # ничего не делало на VPS: переменная в контейнер не доезжала.
      PATCH_LAG: "${PATCH_LAG:-1}"
      PATCH_MAP_RETRY_S: "${PATCH_MAP_RETRY_S:-600}"
      RANKS_FILL_BUDGET: "${RANKS_FILL_BUDGET:-200}"
      RANKS_SEED_MATCHES: "${RANKS_SEED_MATCHES:-1000}"
      REPLAY_RETENTION_DAYS: "${REPLAY_RETENTION_DAYS:-3}"
      # Ключ Steam Web API: без него SteamMatchStream падает, очередь
      # своей разбивки не наполняется, и candidates-collector работает
      # вхолостую. Ровно это и происходило на VPS: ключ в env-файле был,
      # в контейнере — нет.
      STEAM_API_KEY: "${STEAM_API_KEY:-}"
      STEAM_DELAY_S: "${STEAM_DELAY_S:-1.0}"
      STRATZ_API_TOKEN: "${STRATZ_API_TOKEN:-}"
      STRATZ_BATCH_SIZE: "${STRATZ_BATCH_SIZE:-1}"
      STRATZ_DETAIL_BUDGET: "${STRATZ_DETAIL_BUDGET:-}"
      STRATZ_ID_LAG: "${STRATZ_ID_LAG:-90000}"
      STRATZ_ID_LAG_MAX: "${STRATZ_ID_LAG_MAX:-400000}"
      STRATZ_ID_LAG_MIN: "${STRATZ_ID_LAG_MIN:-30000}"
      STRATZ_KILLS_CUMULATIVE: "${STRATZ_KILLS_CUMULATIVE:-}"
      STRATZ_LIMIT: "${STRATZ_LIMIT:-40}"
      STRATZ_MIN_PATCH: "${STRATZ_MIN_PATCH:-}"
      STRATZ_MIN_RANK: "${STRATZ_MIN_RANK:-${OPENDOTA_MIN_RANK:-80}}"
      STRATZ_QUOTA_FLOOR: "${STRATZ_QUOTA_FLOOR:-500}"
      STRATZ_RANK_FIELD: "${STRATZ_RANK_FIELD:-seasonRank}"
      STRATZ_RATE_SLEEP_S: "${STRATZ_RATE_SLEEP_S:-3600}"
      STRATZ_RETRY_ATTEMPTS: "${STRATZ_RETRY_ATTEMPTS:-3}"
      STRATZ_RUN_BUDGET: "${STRATZ_RUN_BUDGET:-1000}"
      STRATZ_SKIP_FRESHEST: "${STRATZ_SKIP_FRESHEST:-0}"
      TIMELINE_DETAIL_BUDGET: "${TIMELINE_DETAIL_BUDGET:-}"
      TIMELINE_LIMIT: "${TIMELINE_LIMIT:-30}"
      # Первая пауза после ОБРЫВА у внешнего API (5xx, сеть) — не после
      # отказа по квоте. Дальше удваивается до обычного интервала.
      TRANSIENT_SLEEP_S: "${TRANSIENT_SLEEP_S:-300}"
      # Сколько неудач подряд превращают хост в «недостижимый» и на
      # сколько. Порог не единица: единичный обрыв бывает и у живого
      # сервера, а заклеймённый хост молчит часами (спринт 153).
      UNREACHABLE_AFTER: "${UNREACHABLE_AFTER:-2}"
      UNREACHABLE_TTL_S: "${UNREACHABLE_TTL_S:-21600}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: ${MANTA_DB_PASSWORD:-dota_dev_password}
      POSTGRES_DB: manta
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dota -d manta"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: ${MANTA_DB_PASSWORD:-dota_dev_password}
      CLICKHOUSE_DB: manta
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "dota", "--password", "${MANTA_DB_PASSWORD:-dota_dev_password}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dota
      MINIO_ROOT_PASSWORD: ${MANTA_DB_PASSWORD:-dota_dev_password}
    ports:
      - "9500:9000"
      - "9501:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MLflow Tracking + Model Registry (Гл. 10.6, Фаза 4). Артефакты
  # проксируются через сервер (--serve-artifacts) — клиентам не нужны
  # S3-креды. Прод-режим (D1): метаданные в postgres (БД mlflow из
  # миграции 004 — прогнать make migrate-pg до первого старта).
  # Официальный образ без драйвера postgres — добавляем его при сборке.
  # Клиенты включают бэкенд переменной REGISTRY_BACKEND=mlflow
  # (по умолчанию — собственный S3-реестр).
  mlflow:
    image: manta-mlflow:2.16.2-postgres
    build:
      context: ..
      dockerfile: deployments/mlflow.Dockerfile
    # Драйвер PostgreSQL входит в образ: на VPS MLflow работает во
    # внутренней Docker-сети без выхода в интернет и не может ставить
    # зависимости при каждом старте.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://dota:${MANTA_DB_PASSWORD:-dota_dev_password}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "9600:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Профиль apps: весь конвейер платформы поверх инфраструктуры.
  #   docker compose --profile apps up -d --build
  # Внутрисетевые адреса: kafka:29092, postgres:5432, clickhouse:8123,
  # minio:9000. Топики Kafka создаются заранее: make topics.
  # ---------------------------------------------------------------------------

  api-gateway:
    profiles: ["apps"]
    # Контекст сборки — КОРЕНЬ монорепо: go.mod ссылается на proto/gen/go
    # за пределами каталога сервиса (см. Dockerfile).
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment: &app-env
      KAFKA_BROKERS: kafka:29092
      POSTGRES_DSN: postgresql://dota:${MANTA_DB_PASSWORD:-dota_dev_password}@postgres:5432/manta
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: dota
      S3_SECRET_KEY: ${MANTA_DB_PASSWORD:-dota_dev_password}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: manta
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: ${MANTA_DB_PASSWORD:-dota_dev_password}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  data-collector:
    profiles: ["apps"]
    # Контекст сборки — КОРЕНЬ монорепо: образу нужен libs/ (см. Dockerfile).
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: opendota-public   # Immortal-паблики текущего патча
      COLLECTOR_INTERVAL_SECONDS: "${PUBLIC_REPLAY_INTERVAL:-3600}"
      METRICS_PORT: "9105"
      # OPENDOTA_LIMIT здесь БОЛЬШЕ НЕ ЗАДАЁТСЯ. Зашитая тройка молча
      # перебивала значение из окружения машины: вписал 2 в свой файл —
      # получил 3, и никакой ошибки. Умолчание живёт в самом коллекторе.
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  timeline-collector:
    # Таймлайны публичных матчей — основной приток витрины.
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: opendota-timeline
      COLLECTOR_INTERVAL_SECONDS: "${TIMELINE_INTERVAL:-1800}"
      TIMELINE_LIMIT: "${TIMELINE_LIMIT:-10}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9108"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  pro-timeline-collector:
    # Про-матчи: ЭТАЛОН гейта. Лимит приходит из PRO_TIMELINE_LIMIT, а
      # переменная внутри всё равно TIMELINE_LIMIT — так же, как в
      # dev-recover.sh. Подставить сюда обычный TIMELINE_LIMIT значит
      # молча сжечь квоту про-потоком.
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: opendota-timeline-pro
      COLLECTOR_INTERVAL_SECONDS: "${PRO_TIMELINE_INTERVAL:-3600}"
      TIMELINE_LIMIT: "${PRO_TIMELINE_LIMIT:-5}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9110"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  league-collector:
    # Про-матчи вглубь по лигам: окно /proMatches выбирается за сутки,
      # и эталон перестаёт расти без этого источника.
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: opendota-league
      COLLECTOR_INTERVAL_SECONDS: "${LEAGUE_INTERVAL:-3600}"
      TIMELINE_LIMIT: "${LEAGUE_LIMIT:-6}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9117"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  pro-replay-collector:
    # Реплейный путь про-матчей.
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: opendota
      COLLECTOR_INTERVAL_SECONDS: "${PRO_REPLAY_INTERVAL:-3600}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9109"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  salt-collector:
    # Реплеи по солям, добытым у Game Coordinator (спринт 181).
    #
    # Единственный источник, которому НЕ нужна квота OpenDota: соль и
    # адрес уже лежат в ReplaySalts, их наполняет `scripts/gc-salts.sh`
    # по cron. Поэтому он работает и тогда, когда суточная квота выбрана
    # и остальные реплейные источники стоят.
    #
    # Темп согласован с добычей: наполнитель берёт 8 солей в час, здесь
    # 8 реплеев в час — очередь не растёт и не простаивает. Это около
    # 190 матчей и 11 ГБ в сутки; на диске держится втрое меньше, потому
    # что REPLAY_RETENTION_DAYS=3 удаляет .dem через трое суток
    # (спринт 138).
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: salts
      COLLECTOR_INTERVAL_SECONDS: "${SALTS_INTERVAL:-3600}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9118"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  stratz-collector:
    # ТОЛЬКО при заданном STRATZ_API_TOKEN: без него источник падает на
      # старте, а restart: unless-stopped превратил бы это в ровный шум
      # в логах. Поэтому отдельный профиль, включаемый bootstrap'ом.
    profiles: ["apps", "stratz"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: stratz-timeline
      COLLECTOR_INTERVAL_SECONDS: "${STRATZ_INTERVAL:-1800}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9115"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  candidates-collector:
    # Своя разбивка: качает по 58 МиБ на матч и делит квоту с
      # остальными. Включается осознанно (CANDIDATES_ENABLED=1).
    profiles: ["apps", "candidates"]
    build:
      context: ..
      dockerfile: apps/data-collector/Dockerfile
    environment:
      <<: [*app-env, *collector-env]
      COLLECTOR_SOURCE: candidates
      COLLECTOR_INTERVAL_SECONDS: "${CANDIDATES_INTERVAL:-900}"
      # Порт метрик У КАЖДОГО СВОЙ. Общее значение занял бы первый
      # стартовавший, остальные упали бы с «Address already in use».
      METRICS_PORT: "9116"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  parser-svc:
    profiles: ["apps"]
    build: ../apps/replay-parser
    environment:
      <<: *app-env
      WORK_DIR: /tmp
      PURGE_PARSED_REPLAYS: "true"   # события в ClickHouse, .dem не копим
    depends_on:
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  feature-extractor:
    profiles: ["apps"]
    # Контекст сборки — КОРЕНЬ монорепо: образу нужен libs/ (см. Dockerfile).
    build:
      context: ..
      dockerfile: apps/feature-extractor/Dockerfile
    environment: *app-env
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  ml-service:
    profiles: ["apps"]
    # Контекст сборки — КОРЕНЬ монорепо: образу нужен libs/ (см. Dockerfile).
    build:
      context: ..
      dockerfile: apps/ml-service/Dockerfile
    command: ["-m", "app"]
    environment:
      <<: *app-env
      MODEL_PATH: registry://win_probability/production
    ports:
      - "50051:50051"
    depends_on:
      minio: { condition: service_healthy }
    restart: unless-stopped

  ml-autotrain:
    profiles: ["apps"]
    # Контекст сборки — КОРЕНЬ монорепо: образу нужен libs/ (см. Dockerfile).
    build:
      context: ..
      dockerfile: apps/ml-service/Dockerfile
    command: ["-m", "training.auto"]
    environment:
      <<: *app-env
      RETRAIN_INTERVAL_S: "21600"       # проверка раз в 6 часов
      RETRAIN_MIN_NEW_MATCHES: "20"     # переобучать при +20 матчах
      RETRAIN_MIN_TOTAL_MATCHES: "50"
      MODEL_OUT: /tmp/win_probability.pkl
      # Telegram-уведомления (опционально): значения берутся из окружения/.env
      # хоста, пусто по умолчанию — тогда уведомления выключены. НЕ коммитить.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    depends_on:
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    profiles: ["apps"]
    build: ../apps/frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  report-generator:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/report-generator/Dockerfile
    environment:
      <<: *app-env
      ML_GRPC_ADDR: ml-service:50051
      # Сторож за производством отчётов (спринт 191). БЕЗ токена он
      # молчит — а молчащий сторож ровно то, что стоило проекту 29 часов
      # незамеченного отказа генерации 2-3 сентября.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Профиль monitoring: Prometheus + Grafana (Гл. 11).
  #   docker compose --profile monitoring up -d
  # Дашборд «Платформа: конвейер и модель» провижнится автоматически;
  # Grafana: localhost:3001 (admin/admin).
  # ---------------------------------------------------------------------------

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # dev: скрейп хост-процессов
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg_data:
  ch_data:
  kafka_data:
  minio_data:
  mlflow_data:
  prom_data:
  grafana_data:
