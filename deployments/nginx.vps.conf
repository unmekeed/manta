server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # VPS gateway всегда TLS. Сертификат самоподписанный, но проверяется
    # по явно смонтированному trust anchor и SAN api-gateway.
    location /api/ {
        proxy_pass https://api-gateway:8080;
        proxy_ssl_server_name on;
        proxy_ssl_name api-gateway;
        proxy_ssl_trusted_certificate /run/manta-secrets/tls-cert.pem;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
