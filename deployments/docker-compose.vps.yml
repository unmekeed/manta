# Наложение для публичного VPS. Применяется ПОВЕРХ docker-compose.yml:
#
#     docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# (или просто `make vps-up` из корня).
#
# Базовый файл писался для домашней машины за NAT, и там открытые наружу
# порты безвредны. На VPS с белым адресом это другое: Postgres, ClickHouse,
# MinIO, Kafka, Grafana и панель MinIO публикуются на 0.0.0.0 с паролем
# `dota_dev_password`, который лежит в git. Такую базу находят сканерами
# за часы, а не за месяцы.
#
# ЧТО ДЕЛАЕТ ЭТОТ ФАЙЛ. Две вещи и ничего больше:
#
#   1. Прибивает КАЖДЫЙ публикуемый порт к 127.0.0.1. Снаружи не остаётся
#      ничего; доступ — через SSH-туннель (см. docs/SETUP-VPS.md).
#   2. Ставит потолки памяти. Без них ClickHouse на 8 ГБ машине съедает
#      всё и роняет соседей — он рассчитывает лимиты от ВСЕЙ памяти
#      хоста, не зная, что делит её с Kafka и Postgres.
#
# Пароли этот файл НЕ меняет: они приходят из окружения (см. bootstrap),
# и класть их сюда значило бы вернуть в git ровно то, от чего уходим.
#
# ВАЖНО: каждый новый порт в базовом файле надо добавлять и сюда, иначе
# он окажется открыт наружу. Это стережёт тест
# scripts/tests/test_vps_compose.py — он сверяет два файла и падает,
# если появился порт без loopback-привязки.
name: manta

x-clickhouse-reader-env: &clickhouse-reader-env
  CLICKHOUSE_USER: manta_ch_reader
  CLICKHOUSE_PASSWORD: "${MANTA_CH_PASS_READER:?MANTA_CH_PASS_READER is required}"
x-clickhouse-writer-env: &clickhouse-writer-env
  CLICKHOUSE_USER: manta_ch_writer
  CLICKHOUSE_PASSWORD: "${MANTA_CH_PASS_WRITER:?MANTA_CH_PASS_WRITER is required}"
x-clickhouse-trainer-env: &clickhouse-trainer-env
  CLICKHOUSE_USER: manta_ch_trainer
  CLICKHOUSE_PASSWORD: "${MANTA_CH_PASS_TRAINER:?MANTA_CH_PASS_TRAINER is required}"

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - default
      - mlflow-internal

  clickhouse:
    ports: !override
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    # Потолок процесса ставится и снаружи (mem_limit), и внутри
    # (max_server_memory_usage): только внешний ClickHouse не видит и
    # продолжает планировать запросы под всю память хоста, получая OOM
    # вместо внятного «превышен лимит памяти».
    mem_limit: 3g
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 0
      # The official image applies this flag to CLICKHOUSE_USER (`dota`),
      # enabling bootstrap to create the least-privilege roles and users.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    command: ["redis-server", "--requirepass", "${MANTA_REDIS_PASSWORD:?MANTA_REDIS_PASSWORD is required}"]
    environment:
      MANTA_REDIS_PASSWORD: "${MANTA_REDIS_PASSWORD:?MANTA_REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$MANTA_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
    restart: unless-stopped

  kafka:
    ports: !override
      - "127.0.0.1:9092:9092"
    # JVM: самый прожорливый сосед после ClickHouse.
    mem_limit: 1500m
    restart: unless-stopped

  minio:
    ports: !override
      - "127.0.0.1:9500:9000"
      - "127.0.0.1:9501:9001"
    mem_limit: 512m
    volumes:
      - ../infra/minio/policies:/policies:ro
    restart: unless-stopped

  mlflow:
    ports: !override
      - "127.0.0.1:9600:5000"
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - mlflow-internal

  api-gateway:
    ports: !override
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    restart: unless-stopped
    environment:
      MANTA_PROD: "1"
      JWT_PUBLIC_KEY_FILE: /run/manta-secrets/jwt-public.pem
      TLS_CERT_FILE: /run/manta-secrets/tls-cert.pem
      TLS_KEY_FILE: /run/manta-secrets/tls-key.pem
      POSTGRES_DSN: "postgresql://manta_gateway_user:${MANTA_DB_PASS_GATEWAY:?MANTA_DB_PASS_GATEWAY is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
      <<: *clickhouse-writer-env
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: "${MANTA_REDIS_PASSWORD:?MANTA_REDIS_PASSWORD is required}"
    volumes:
      - "${MANTA_KEYS_DIR:?MANTA_KEYS_DIR is required}/jwt-public.pem:/run/manta-secrets/jwt-public.pem:ro"
      - "${MANTA_KEYS_DIR:?MANTA_KEYS_DIR is required}/tls-cert.pem:/run/manta-secrets/tls-cert.pem:ro"
      - "${MANTA_KEYS_DIR:?MANTA_KEYS_DIR is required}/tls-key.pem:/run/manta-secrets/tls-key.pem:ro"

  data-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  timeline-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  pro-timeline-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  league-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  pro-replay-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  stratz-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  candidates-collector:
    environment:
      <<: *clickhouse-writer-env
      POSTGRES_DSN: "postgresql://manta_collector_user:${MANTA_DB_PASS_COLLECTOR:?MANTA_DB_PASS_COLLECTOR is required}@postgres:5432/manta"
      S3_ACCESS_KEY: manta_ingest
      S3_SECRET_KEY: "${MANTA_S3_PASS_INGEST:?MANTA_S3_PASS_INGEST is required}"
    restart: unless-stopped

  report-generator:
    environment:
      <<: *clickhouse-reader-env
      POSTGRES_DSN: "postgresql://manta_reports_user:${MANTA_DB_PASS_REPORTS:?MANTA_DB_PASS_REPORTS is required}@postgres:5432/manta"
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
    restart: unless-stopped

  parser-svc:
    environment:
      <<: *clickhouse-writer-env
      S3_ACCESS_KEY: manta_parser
      S3_SECRET_KEY: "${MANTA_S3_PASS_PARSER:?MANTA_S3_PASS_PARSER is required}"
    restart: unless-stopped

  feature-extractor:
    environment:
      <<: *clickhouse-writer-env
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
    restart: unless-stopped

  ml-service:
    environment:
      <<: *clickhouse-reader-env
      S3_ACCESS_KEY: manta_model_reader
      S3_SECRET_KEY: "${MANTA_S3_PASS_MODEL_READER:?MANTA_S3_PASS_MODEL_READER is required}"
    ports: !override
      - "127.0.0.1:50051:50051"
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - default
      - mlflow-internal

  ml-autotrain:
    environment:
      <<: *clickhouse-trainer-env
      S3_ACCESS_KEY: manta_model_writer
      S3_SECRET_KEY: "${MANTA_S3_PASS_MODEL_WRITER:?MANTA_S3_PASS_MODEL_WRITER is required}"
    restart: unless-stopped
    networks:
      - default
      - mlflow-internal

  frontend:
    ports: !override
      - "127.0.0.1:3000:80"
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ./nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
      - "${MANTA_KEYS_DIR:?MANTA_KEYS_DIR is required}/tls-cert.pem:/run/manta-secrets/tls-cert.pem:ro"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    restart: unless-stopped
    volumes: !override
      - ./monitoring/prometheus.vps.yml:/etc/prometheus/prometheus.yml:ro
      - "${MANTA_KEYS_DIR:?MANTA_KEYS_DIR is required}/tls-cert.pem:/run/manta-secrets/tls-cert.pem:ro"
      - prom_data:/prometheus

  grafana:
    ports: !override
      - "127.0.0.1:3001:3000"
    mem_limit: 256m
    restart: unless-stopped

networks:
  mlflow-internal:
    internal: true
